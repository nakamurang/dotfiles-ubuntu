# Single-line minimalist prompt
format = """$directory$git_branch$git_status$character"""

[directory]
style = "bold white"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[󰄾](bold white) " 
error_symbol = "[󰄾](bold red) "

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "#F1502F"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
